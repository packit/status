name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository_owner == 'packit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          submodules: true

      - name: Hugo Deploy GitHub Pages
        uses: benmatselby/hugo-deploy-gh-pages@c0e2d9ecd5fb30073fa70210a9029e57e733bff0 # v2.5.0
        env:
          CNAME: status.packit.dev
          GITHUB_ACTOR: usercont-release-bot
          HUGO_VERSION: 0.98.0
          HUGO_EXTENDED: true
          TARGET_REPO: packit/status-github-pages
          TARGET_BRANCH: main
          TOKEN: ${{ secrets.RELEASEBOT_GITHUB_TOKEN }}
